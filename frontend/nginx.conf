# ─────────────────────────────────────────────
# Look at Life - nginx 설정 (컨테이너 안 /etc/nginx/conf.d/default.conf)
# 외부에서 들어오는 요청을 한 곳에서 받아 나눈다.
#   /api/...  → Spring (docker compose 서비스 이름 backend, 포트 8080)
#   그 외     → React 빌드 파일 (화면 주소는 index.html로 돌려 React Router가 처리)
# HTTPS(443)는 서버(EC2) 단계에서 추가한다.
# ─────────────────────────────────────────────
server {
    listen 80;
    server_name _;

    # 사진을 base64(JSON)로 올리므로 요청 크기 제한을 넉넉히 둔다 (nginx 기본 1MB)
    client_max_body_size 20m;

    location /api/ {
        proxy_pass http://backend:8080;
        # $http_host = 브라우저가 보낸 주소 그대로(포트 포함). $host는 포트를 빼서
        # Spring이 같은 주소의 요청(POST의 Origin 헤더)을 다른 주소로 오인해 CORS로 막을 수 있다.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 추천, 배경 제거는 AI 추론으로 오래 걸릴 수 있다 (nginx 기본 60초)
        # Spring의 배경 제거 대기 시간(120초)보다 길게 둔다
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
